# Netlify configuration for the Museum of Fantasy Sports app.
#
# This deploys as its own Netlify site. The portfolio site (huntermshaps.com)
# proxies /fantasy/* here, so visitors only ever see the portfolio's domain.
# The app is built with `basePath: "/fantasy"` (next.config.ts), which is why
# every URL it serves already carries that prefix.

[build]
  command = "pnpm prisma generate && pnpm build"
  publish = ".next"

[build.environment]
  # Deliberately no PRISMA_CLI_BINARY_TARGETS. This project uses the
  # @prisma/adapter-pg driver adapter, so Prisma 7 ships no query engine binary
  # at all — setting a binary target makes `prisma generate` fail outright with
  # "Unknown binaryTarget native and no custom engine files were provided".
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Auth endpoints must never be cached — a cached session response would hand
# one visitor another visitor's session.
[[headers]]
  for = "/fantasy/api/auth/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
